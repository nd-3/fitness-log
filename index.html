<title>IRON LOG - 筋トレ記録</title>

  .today-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .ex-row-wrap { display: flex; align-items: stretch; gap: 6px; margin-bottom: 6px; }
  .ex-row { display: flex; flex-direction: column; background: var(--surface); border-radius: 10px; padding: 9px 11px; cursor: pointer; border: none; flex: 1; min-width: 0; text-align: left; color: var(--text); font-family: inherit; }

  .ex-row-top span:first-child { font-size: 13.5px; }
  .ex-row .target { font-size: 11.5px; color: var(--accent2); font-family: ui-monospace, monospace; white-space: nowrap; margin-left: 8px; text-align: right; line-height: 1.5; }

  .field { margin-bottom: 12px; }

  input[type=number] { font-family: ui-monospace, monospace; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-primary { width: 100%; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .log-item .name { font-size: 13.5px; font-weight: 600; margin: 0; }
  .log-item .stat { font-size: 12px; color: var(--accent2); font-family: ui-monospace, monospace; margin: 2px 0 0; }
  .del-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 14px; }

  .suggest-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-top: 6px; padding: 6px 8px; background: rgba(193,68,42,0.12); border: 1px solid var(--accent); border-radius: 8px; font-size: 11px; color: var(--text); flex-wrap: wrap; }
  .apply-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
  .memo-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .memo-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .memo-body { font-size: 12.5px; color: var(--text-muted); line-height: 1.7; margin-top: 10px; }
  .memo-body b { color: var(--text); }
  .sw-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .sw-display { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 800; color: var(--accent); min-width: 62px; }
  .sw-btn { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  .side-row { display: flex; gap: 8px; }
  .side-btn { flex: 1; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px; padding: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .side-btn.side-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .period-btn { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 5px 9px; font-size: 11px; cursor: pointer; }
  .period-btn.period-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  @keyframes popCelebrate { 0%{opacity:0; transform:scale(0.6) translateY(4px);} 40%{opacity:1; transform:scale(1.12);} 100%{opacity:1; transform:scale(1);} }
  .celebrate-badge { animation: popCelebrate 0.6s ease; }
  .streak-num { font-size: 38px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--accent); margin: 4px 0; }
</style>

<body>

const DEFAULT_EXERCISES_META = [

  {name:"ベンチ支持ロウ", primary:"広背筋", secondary:"僧帽筋・上腕二頭筋", unilateral:false, compound:true, strap:true},

  {name:"ダンベルプルオーバー", primary:"広背筋", secondary:"大胸筋・上腕三頭筋", unilateral:false, compound:false},
  {name:"インクラインダンベルカール", primary:"上腕二頭筋", secondary:"", unilateral:false, compound:false},
  {name:"ダンベルサイドベンド", primary:"腹斜筋", secondary:"", unilateral:true, compound:false},
  {name:"ダンベルフライ", primary:"大胸筋", secondary:"三角筋前部", unilateral:false, compound:false},

function uid(p){ return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7); }
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayStr(){ return localDateStr(new Date()); }
function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + (day===0 ? -6 : 1-day));
  date.setHours(0,0,0,0);
  return date;
}
function weekKeyFor(d){ return localDateStr(mondayOf(d)); }
function defaultWeekTypeFor(d){
  const REF = new Date("2026-08-10T00:00:00");
  const diffWeeks = Math.round((mondayOf(d)-REF)/(7*86400000));
  return diffWeeks % 2 === 0 ? "heavy" : "reps";
}
function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ showToast("保存エラー"); }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let exercises = load("ironlog_exercises", DEFAULT_EXERCISES_META.map((m,i)=>({id:"ex_"+i, name:m.name, primary:m.primary, secondary:m.secondary, unilateral:!!m.unilateral, compound:!!m.compound, strap:!!m.strap})));
let logs = load("ironlog_logs", []);
let program = load("ironlog_program", DEFAULT_PROGRAM);

function collectProgramExerciseNames(){
  const names = [];
  Object.values(program).forEach(p => {
    if (!p) return;
    if (p.type === "light") (p.exercises||[]).forEach(e=>{ if (e.name) names.push(e.name); });
    if (p.type === "main") {
      (p.heavy||[]).forEach(e=>{ if (e.name) names.push(e.name); });
      (p.reps||[]).forEach(e=>{ if (e.name) names.push(e.name); });
    }
  });
  return names;
}
function syncExercisesWithProgram(){
  const names = collectProgramExerciseNames();
  let changed = false;
  names.forEach(n => {
    if (!exercises.find(e=>e.name===n)) {
      const meta = DEFAULT_EXERCISES_META.find(m=>m.name===n);
      exercises.push({id: uid("ex"), name:n, primary: meta?meta.primary:"", secondary: meta?meta.secondary:"", unilateral: meta?!!meta.unilateral:false, compound: meta?!!meta.compound:false, strap: meta?!!meta.strap:false});
      changed = true;
    }
  });
  if (changed) save("ironlog_exercises", exercises);
}
syncExercisesWithProgram();

let tab = "log";
let selectedExId = exercises[0] ? exercises[0].id : null;

let swRunning = false;

let swElapsed = 0;
let swIntervalId = null;
let logFilterMode = "today";
let logSide = "L";
let logFlag = false;
let heatmapPeriod = "3m";
let heatmapSelectedDate = null;

(function initWeekType(){
  const now = new Date();
  const todayKey = weekKeyFor(now);
  const savedWT = load("ironlog_weektype", null);
  let wt = defaultWeekTypeFor(now);
  if (savedWT && savedWT.weekKey === todayKey) wt = savedWT.type;
  save("ironlog_weektype", {weekKey: todayKey, type: wt});
  window.__weekType = wt;
  window.__weekKey = todayKey;
})();

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; }, 1500);
}
function setTab(t){ tab = t; render(); }
function toggleWeekType(){
  window.__weekType = window.__weekType === "heavy" ? "reps" : "heavy";
  save("ironlog_weektype", {weekKey: window.__weekKey, type: window.__weekType});
  render();
}
function openVideoSearch(name){
  const q = encodeURIComponent(name + " ダンベル");
  window.open("https://www.youtube.com/results?search_query=" + q, "_blank");
}
function pickExerciseByName(name){
  const found = exercises.find(e=>e.name===name);
  if (found) selectedExId = found.id;
  tab = "log";
  render();
}
function addExercise(){
  const val = document.getElementById("newExInput").value.trim();
  if(!val) return;
  exercises = [...exercises, {id: uid("ex"), name: val, primary:"", secondary:"", unilateral:false, compound:false, strap:false}];
  save("ironlog_exercises", exercises);
  render();
}

function getSessionDuration(date){
  const dayLogs = logs.filter(l=>l.date===date && l.timestamp);
  if (dayLogs.length < 2) return null;
  const timestamps = dayLogs.map(l=>l.timestamp);
  return Math.round((Math.max(...timestamps) - Math.min(...timestamps)) / 60000);
}
function getAllTimeMax(exerciseId, side){
  const matching = logs.filter(l=>l.exerciseId===exerciseId && (l.side||null)===(side||null));
  if (matching.length===0) return null;
  return Math.max(...matching.map(l=>l.weight));
}
function isSessionComplete(date){
  const d = new Date(date + "T00:00:00");
  const dow = d.getDay();
  const p = program[dow];
  if (!p || p.type === "rest") return false;
  const variant = p.type === "main" ? getWeekTypeForDate(date) : "exercises";
  const list = variant === "exercises" ? p.exercises : p[variant];
  if (!list || list.length === 0) return false;
  return list.every(ex => {
    const exMaster = exercises.find(e=>e.name===ex.name);
    if (!exMaster) return false;
    return logs.some(l=>l.exerciseId===exMaster.id && l.date===date);
  });
}
function computeSessionSummary(date){
  const dayLogs = logs.filter(l=>l.date===date);
  if (dayLogs.length===0) return null;
  const totalVolume = dayLogs.reduce((sum,l)=>sum+l.weight*l.reps*l.sets, 0);
  const prSet = new Set();
  dayLogs.forEach(l=>{
    const allTimeMax = getAllTimeMax(l.exerciseId, l.side||null);
    if (allTimeMax !== null && l.weight === allTimeMax) prSet.add(l.exerciseId+"_"+(l.side||""));
  });
  return { totalVolume, prCount: prSet.size, duration: getSessionDuration(date) };
}
function dismissSessionSummary(date){
  save("ironlog_dismissed_summary", date);
  render();
}
function renderSessionSummaryCard(){

}
function addLog(){
  const w = document.getElementById("inWeight").value;
  const r = document.getElementById("inReps").value;
  const s = document.getElementById("inSets").value;
  const d = document.getElementById("inDate").value;
  if(!selectedExId || w==="" || r==="" || s==="") return;
  const selectedEx = exercises.find(e=>e.id===selectedExId);
  const side = (selectedEx && selectedEx.unilateral) ? logSide : null;
  const setNumber = logs.filter(l => l.exerciseId===selectedExId && l.date===d && (l.side||null)===(side||null)).length + 1;
  const newWeight = parseFloat(w);
  const prevMax = getAllTimeMax(selectedExId, side);
  const isPR = prevMax !== null && newWeight > prevMax;
  logs = [...logs, {id: uid("log"), exerciseId: selectedExId, date: d, weight: newWeight, reps: parseInt(r,10), sets: parseInt(s,10), side, setNumber, timestamp: Date.now(), flag: logFlag}];
  save("ironlog_logs", logs);
  form = {date: d};
  const flagUsed = logFlag;
  logFlag = false;
  if (isPR) {
    showToast(`🏆 自己ベスト更新！ ${newWeight}kg`);
  } else {
    showToast(side ? `記録した(${side==="L"?"左":"右"}・${setNumber}セット目)` : `記録した(${setNumber}セット目)${flagUsed?" ⚠️":""}`);
  }
  render();
}

function groupTodaysLogs(sortedLogs){
  const seen = new Map();
  const order = [];
  sortedLogs.forEach(l => {
    const key = `${l.exerciseId}::${l.weight}::${l.reps}::${l.side||""}`;
    if (!seen.has(key)) {
      const g = {exerciseId:l.exerciseId, weight:l.weight, reps:l.reps, side:l.side, sets:0, ids:[], setNumbers:[], flag:false};
      seen.set(key, g);
      order.push(g);
    }
    const g = seen.get(key);
    g.sets += l.sets;
    g.ids.push(l.id);
    if (l.setNumber) g.setNumbers.push(l.setNumber);
    if (l.flag) g.flag = true;
  });
  order.forEach(g => g.setNumbers.sort((a,b)=>a-b));
  return order;
}

function formatSW(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = (sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function swTick(){
  swElapsed = Math.floor((Date.now() - swStartTime)/1000);
  const disp = document.getElementById("swDisplay");
  if (disp) disp.textContent = formatSW(swElapsed);
  else { clearInterval(swIntervalId); }
}
function toggleStopwatch(){
  const btn = document.getElementById("swToggleBtn");
  if (!swRunning) {
    swRunning = true;
    swStartTime = Date.now() - swElapsed*1000;
    swIntervalId = setInterval(swTick, 250);
    if (btn) btn.textContent = "⏹ 停止";
  } else {
    swRunning = false;
    clearInterval(swIntervalId);
    if (btn) btn.textContent = "▶ 開始";
    const repsInput = document.getElementById("inReps");
    if (repsInput) repsInput.value = swElapsed;
    showToast("計測結果を回数欄に入れた");
  }
}
function resetStopwatch(){
  swRunning = false;
  clearInterval(swIntervalId);
  swElapsed = 0;
  const disp = document.getElementById("swDisplay");
  if (disp) disp.textContent = "00:00";
  const btn = document.getElementById("swToggleBtn");
  if (btn) btn.textContent = "▶ 開始";
}

function parseTargetKgRange(target){
  if (!target) return null;
  const nums = target.match(/\d+(\.\d+)?/g);
  if (!nums) return null;
  const vals = nums.map(Number);
  return { min: Math.min(...vals), max: Math.max(...vals) };
}
function parseRepsTarget(reps){
  if (!reps || reps.indexOf("秒") !== -1) return null;
  const m = reps.match(/^(\d+)回/);
  return m ? parseInt(m[1],10) : null;
}
function isBetterSet(candidate, current){
  if (!current) return true;
  if (candidate.weight !== current.weight) return candidate.weight > current.weight;
  return candidate.reps > current.reps;
}
function getLastLogForExerciseName(name){
  const ex = exercises.find(e=>e.name===name);
  if (!ex) return null;
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length === 0) return null;
  const mostRecentDate = exLogs.map(l=>l.date).sort().pop();
  const dayLogs = exLogs.filter(l=>l.date===mostRecentDate);
  return dayLogs.reduce((best,l)=> isBetterSet(l,best) ? l : best, null);
}
function sessionOverJump(date, exerciseId){
  const dayLogs = logs.filter(l=>l.exerciseId===exerciseId && l.date===date).sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
  for (let i=1;i<dayLogs.length;i++){
    const prev = dayLogs[i-1], cur = dayLogs[i];
    if (cur.weight > prev.weight && cur.reps <= prev.reps*0.5 && cur.reps < 6) {
      return {prevWeight:prev.weight, curWeight:cur.weight, prevReps:prev.reps, curReps:cur.reps};
    }
  }
  return null;
}
function getRecentSessionDates(exerciseId, n){
  const conditions = load("ironlog_conditions", {});
  const dates = [...new Set(logs.filter(l=>l.exerciseId===exerciseId).map(l=>l.date))]
    .filter(d => { const c = conditions[d]; return !(c && c<=2); })
    .filter(d => !isDateInDeloadWeek(d))
    .sort().reverse();
  return dates.slice(0, n);
}
function sessionAllMet(date, exerciseId, repsTarget, weightMax){
  const set1s = logs.filter(l=>l.exerciseId===exerciseId && l.date===date && l.setNumber===1);
  const relevant = set1s.length ? set1s : logs.filter(l=>l.exerciseId===exerciseId && l.date===date);
  if (relevant.length === 0) return false;
  return relevant.every(l => l.reps >= repsTarget && l.weight >= weightMax);
}
function sessionMostlyFailed(date, exerciseId, repsTarget, weightMin){
  const set1s = logs.filter(l=>l.exerciseId===exerciseId && l.date===date && l.setNumber===1 && l.weight >= weightMin);
  const relevant = set1s.length ? set1s : logs.filter(l=>l.exerciseId===exerciseId && l.date===date && l.weight >= weightMin);
  if (relevant.length === 0) return false;
  const failCount = relevant.filter(l => l.reps < repsTarget).length;
  return failCount > relevant.length / 2;
}
function getSessionPosition(date, exerciseId){
  const dayLogs = logs.filter(l=>l.date===date);
  if (dayLogs.length === 0) return null;
  const firstTs = {};
  dayLogs.forEach(l => {
    const t = l.timestamp || 0;
    if (!(l.exerciseId in firstTs) || t < firstTs[l.exerciseId]) firstTs[l.exerciseId] = t;
  });
  const order = Object.keys(firstTs).sort((a,b)=>firstTs[a]-firstTs[b]);
  const idx = order.indexOf(exerciseId);
  return idx === -1 ? null : idx + 1;
}
function getTypicalPosition(exerciseId, excludeDates){
  const dates = [...new Set(logs.filter(l=>l.exerciseId===exerciseId).map(l=>l.date))].filter(d=>!excludeDates.includes(d));
  const positions = dates.map(d=>getSessionPosition(d, exerciseId)).filter(p=>p!==null).sort((a,b)=>a-b);
  if (positions.length === 0) return null;
  const mid = Math.floor(positions.length/2);
  return positions.length % 2 ? positions[mid] : (positions[mid-1]+positions[mid])/2;
}
function positionNote(exerciseId, recentDates){
  const lastDate = recentDates[0];
  const pos = getSessionPosition(lastDate, exerciseId);
  const typical = getTypicalPosition(exerciseId, recentDates);
  if (pos === null || typical === null) return "";
  if (pos - typical >= 2) return "(いつもよりだいぶ後の種目だった。疲労の影響もあるかも)";
  if (typical - pos >= 2) return "(いつもよりだいぶ早い種目だった。フレッシュな状態での結果)";
  return "";
}
function applySuggestedWeight(dow, variant, idx, newWeight){

  const prefixMatch = ex.target.match(/^([^\d]*)/);
  const prefix = prefixMatch ? prefixMatch[1] : "";
  ex.target = `${prefix}${newWeight}kg`;
  save("ironlog_program", program);
  showToast(ex.name + "の目安を更新した");
  render();
}

function toggleEditDay(dow){
  if (editingDay === dow) { harvestDay(dow); editingDay = null; }
  else { editingDay = dow; }
  render();
}
function harvestExRow(dow, variant, idx, fallback){
  const nameEl = document.getElementById(`ex-${dow}-${variant}-${idx}-name`);
  const targetEl = document.getElementById(`ex-${dow}-${variant}-${idx}-target`);
  const benchEl = document.getElementById(`ex-${dow}-${variant}-${idx}-bench`);
  const setsEl = document.getElementById(`ex-${dow}-${variant}-${idx}-sets`);
  const repsEl = document.getElementById(`ex-${dow}-${variant}-${idx}-reps`);
  return {
    name: nameEl ? nameEl.value : fallback.name,
    target: targetEl ? targetEl.value : fallback.target,
    bench: benchEl ? benchEl.value : (fallback.bench||""),
    sets: setsEl ? (parseInt(setsEl.value,10) || fallback.sets) : fallback.sets,
    reps: repsEl ? repsEl.value : fallback.reps,
  };
}
function harvestDay(dow){
  const p = program[dow];
  if (!p || p.type === "rest") return;
  const titleEl = document.getElementById(`title-${dow}`);
  if (titleEl) p.title = titleEl.value;
  if (p.type === "light") p.exercises = (p.exercises||[]).map((ex,idx)=>harvestExRow(dow,"exercises",idx,ex));
  if (p.type === "main") {
    p.heavy = (p.heavy||[]).map((ex,idx)=>harvestExRow(dow,"heavy",idx,ex));
    p.reps = (p.reps||[]).map((ex,idx)=>harvestExRow(dow,"reps",idx,ex));
  }
}
function setDayType(dow, type){
  harvestDay(dow);
  const cur = program[dow] || {};
  if (type === "rest") program[dow] = {type:"rest"};
  else if (type === "light") program[dow] = {type:"light", title: cur.title||"", exercises: cur.exercises && cur.exercises.length ? cur.exercises : [{name:"",target:"",bench:"",sets:3,reps:"12回"}]};
  else if (type === "main") program[dow] = {type:"main", title: cur.title||"", heavy: cur.heavy && cur.heavy.length ? cur.heavy : [{name:"",target:"",bench:"",sets:4,reps:"6回"}], reps: cur.reps && cur.reps.length ? cur.reps : [{name:"",target:"",bench:"",sets:3,reps:"15回"}]};
  render();
}
function addExerciseRow(dow, variant){
  harvestDay(dow);
  program[dow][variant].push({name:"", target:"", bench:"", sets:3, reps:"10回"});
  render();
}
function copyExerciseToOtherVariant(dow, fromVariant, idx){
  harvestDay(dow);
  const p = program[dow];
  const source = p[fromVariant][idx];
  const toVariant = fromVariant === "heavy" ? "reps" : "heavy";
  if (!p[toVariant]) p[toVariant] = [];
  p[toVariant].push({
    name: source.name,
    target: source.target,
    bench: source.bench,
    sets: source.sets,
    reps: source.reps,
  });
  save("ironlog_program", program);
  showToast(`${toVariant==="reps"?"回数週":"重量週"}にコピーした。重量とセット/回数だけ書き換えてOK`);
  render();
}
function removeExerciseRow(dow, variant, idx){

function undoProgramReset(){
  const prev = load("ironlog_program_undo", null);
  if (!prev) { showToast("戻せる履歴がない"); return; }
  program = prev;
  save("ironlog_program", program);
  save("ironlog_program_undo", null);
  showToast("直前の状態に戻した");
  render();

function circleNum(n){
  const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
  return circled[n-1] || `(${n})`;
}
function formatRestTime(sec){
  return sec < 60 ? `${sec}秒` : `${Math.floor(sec/60)}分${sec%60}秒`;
}
function renderLastSessionBreakdown(name, unilateral){
  const ex = exercises.find(e=>e.name===name);
  if (!ex) return "";
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length===0) return "";
  const lastDate = exLogs.map(l=>l.date).sort().pop();
  const dayLogs = exLogs.filter(l=>l.date===lastDate);
  const fmt = arr => arr.map((l,i)=>{
    const rest = (i>0 && l.timestamp && arr[i-1].timestamp) ? Math.round((l.timestamp-arr[i-1].timestamp)/1000) : null;
    return `${circleNum(l.setNumber||i+1)}${l.weight}kg×${l.reps}${rest!==null && rest>0 && rest<1800 ? `<span style="opacity:0.65;">(休憩${formatRestTime(rest)})</span>` : ""}`;
  }).join(" ");
  let out = "";
  if (unilateral) {
    const left = dayLogs.filter(l=>(l.side||"L")==="L").sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    const right = dayLogs.filter(l=>l.side==="R").sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    if (left.length) out += `左 ${fmt(left)}`;
    if (right.length) out += `${out?" / ":""}右 ${fmt(right)}`;
  } else {
    const sorted = dayLogs.slice().sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    out = fmt(sorted);
  }
  const memos = getMemos(lastDate);
  const memoLine = memos.length ? memos.map(m=>`💬 ${esc(m.text)}`).join("<br>") : "";
  return out ? `<div class="muscle-line">📝 前回(${lastDate.slice(5)}): ${out}${memoLine ? `<br>${memoLine}` : ""}</div>` : "";
}
function buildStaticHints(ex, exMaster){
  const weightRange = parseTargetKgRange(ex.target);
  let metaLine = "";
  if (exMaster && (exMaster.primary || exMaster.secondary)) {
    const parts = [`🎯 ${esc(exMaster.primary||"")}`];
    if (exMaster.secondary) parts.push(`副:${esc(exMaster.secondary)}`);
    metaLine = `<div class="muscle-line">${parts.join(" ・ ")}${ex.bench ? " ・ 🪑 "+esc(ex.bench) : ""}</div>`;
  } else if (ex.bench) {
    metaLine = `<div class="bench-line">🪑 ベンチ: ${esc(ex.bench)}</div>`;
  }
  let capacityHint = "";
  if (exMaster) {
    capacityHint = exMaster.compound
      ? `<div class="muscle-line">💪 1セット目の目安: 複合種目なので"あと1〜2回いけそう"のラインで止めるのが安全</div>`
      : `<div class="muscle-line">💪 1セット目の目安: 単関節種目なので限界(できなくなるまで)までやってOK</div>`;
  }
  const strapHint = (exMaster && exMaster.strap) ? `<div class="muscle-line">🧤 ストラップ推奨(握力がボトルネックになりやすい種目)</div>` : "";
  let breathHint = "";
  if (exMaster && exMaster.compound) {
    breathHint = ex.bench
      ? `<div class="muscle-line">🫁 呼吸: 支えありだが余裕あれば毎レップ絞り出すように吐くのがおすすめ</div>`
      : `<div class="muscle-line">🫁 呼吸: 毎レップ、歯の隙間からスーッと絞り出すように吐く(体幹が緩みやすい種目)</div>`;
  }
  let warmupLine = "";
  const scapulaPrefix = (exMaster && exMaster.primary === "広背筋") ? "🦴 肩甲骨スクイーズ×10(5秒キープ・自重) → " : "";
  if (weightRange && weightRange.max > 0) {
    const roundStep = v => Math.round(v/2)*2;
    const stages = [
      {w: roundStep(weightRange.max*0.5), r: "8〜10回"},
      {w: roundStep(weightRange.max*0.7), r: "5〜6回"},
      {w: roundStep(weightRange.max*0.9), r: "2〜3回"},
    ];
    const seen = new Set();
    const steps = stages.filter(s => s.w>0 && s.w<weightRange.max && !seen.has(s.w) && seen.add(s.w));
    if (steps.length) {
      const stepsText = steps.map(s=>`${s.w}kg×${s.r}`).join(" → ");
      warmupLine = `<div class="muscle-line">🔥 ウォームアップ目安: ${scapulaPrefix}${stepsText} → 本番${weightRange.max}kg</div>`;
    } else if (scapulaPrefix) {
      warmupLine = `<div class="muscle-line">🔥 ウォームアップ目安: ${scapulaPrefix}本番${weightRange.max}kg</div>`;
    }
  } else if (scapulaPrefix) {
    warmupLine = `<div class="muscle-line">🔥 ウォームアップ目安: 🦴 肩甲骨スクイーズ×10(5秒キープ・自重)</div>`;
  }
  return metaLine + capacityHint + strapHint + breathHint + warmupLine;
}

function getExerciseSchedule(name){
  const results = [];
  WEEK_ORDER.forEach((dow, orderRank) => {
    const p = program[dow];
    if (!p) return;
    if (p.type === "light") {
      const idx = (p.exercises||[]).findIndex(e=>e.name===name);
      if (idx !== -1) results.push({label: WEEKDAY_JP[dow], pos: idx+1, isLight:true, orderRank});
    } else if (p.type === "main") {
      const hIdx = (p.heavy||[]).findIndex(e=>e.name===name);
      const rIdx = (p.reps||[]).findIndex(e=>e.name===name);
      if (hIdx !== -1 || rIdx !== -1) {
        results.push({label: WEEKDAY_JP[dow], posHeavy: hIdx!==-1?hIdx+1:null, posReps: rIdx!==-1?rIdx+1:null, orderRank});
      }
    }
  });
  return results;
}
function exerciseSortKey(name){
  const sched = getExerciseSchedule(name);
  if (sched.length === 0) return [999, 999];
  const first = sched[0];
  const pos = first.isLight ? first.pos : Math.min(first.posHeavy ?? 999, first.posReps ?? 999);
  return [first.orderRank, pos];
}

}

function computeWeeklyReview(){
  const lastMonday = new Date(mondayOf(new Date()));
  lastMonday.setDate(lastMonday.getDate()-7);
  let scheduledDays = 0, trainedDays = 0, prCount = 0;
  const weekDates = [];
  for (let i=0;i<7;i++){
    const d = new Date(lastMonday); d.setDate(d.getDate()+i);
    const dow = d.getDay();
    const p = program[dow];
    const dateStr = localDateStr(d);
    weekDates.push(dateStr);
    if (!p || p.type === "rest") continue;
    scheduledDays++;
    if (logs.some(l=>l.date===dateStr)) trainedDays++;
  }
  // その週内での自己ベスト該当件数(週内ログのweightが全期間最大と一致するもの、ユニーク種目+side)
  const weekLogs = logs.filter(l=>weekDates.includes(l.date));
  const prSet = new Set();
  weekLogs.forEach(l=>{
    const allTimeMax = getAllTimeMax(l.exerciseId, l.side||null);
    if (allTimeMax !== null && l.weight === allTimeMax) prSet.add(l.exerciseId+"_"+(l.side||""));
  });
  // 体組成の週内変化(先週の最初と最後の記録)
  const metrics = load("ironlog_body_metrics", {});
  const weekMetricDates = weekDates.filter(d=>metrics[d]);
  let bodyChange = null;
  if (weekMetricDates.length >= 2) {
    const first = metrics[weekMetricDates[0]], last = metrics[weekMetricDates[weekMetricDates.length-1]];
    if (first.weight!=null && last.weight!=null) bodyChange = (last.weight-first.weight).toFixed(1);
  }
  return { scheduledDays, trainedDays, prCount: prSet.size, bodyChange, weekStart: weekDates[0], weekEnd: weekDates[6] };
}
function renderWeeklyReviewCard(){
  const r = computeWeeklyReview();

  return `

function computeMuscleGroupInsights(){
  const allProgramExercises = [];
  Object.entries(program).forEach(([dowStr, p]) => {
    if (!p) return;
    if (p.type === "light") (p.exercises||[]).forEach(ex=>allProgramExercises.push(ex));
    if (p.type === "main") (p.heavy||[]).forEach(ex=>allProgramExercises.push(ex));
  });
  const uniqueNames = [...new Set(allProgramExercises.map(e=>e.name))];
  const conditions = load("ironlog_conditions", {});
  const muscleStats = {};
  uniqueNames.forEach(name => {
    const exMaster = exercises.find(e=>e.name===name);
    if (!exMaster || !exMaster.primary) return;
    const progEntry = allProgramExercises.find(e=>e.name===name);
    const repsTarget = parseRepsTarget(progEntry.reps);
    const weightRange = parseTargetKgRange(progEntry.target);
    if (!repsTarget || !weightRange) return;
    const dates = [...new Set(logs.filter(l=>l.exerciseId===exMaster.id).map(l=>l.date))]
      .filter(d => { const c = conditions[d]; return !(c && c<=2); })
      .filter(d => !isDateInDeloadWeek(d));
    dates.forEach(d => {
      const pos = getSessionPosition(d, exMaster.id);
      if (pos===null) return;
      const met = sessionAllMet(d, exMaster.id, repsTarget, weightRange.max);
      const key = exMaster.primary;
      if (!muscleStats[key]) muscleStats[key] = {earlyTotal:0, earlySuccess:0, lateTotal:0, lateSuccess:0, names:new Set()};
      muscleStats[key].names.add(name);
      if (pos<=2) { muscleStats[key].earlyTotal++; if(met) muscleStats[key].earlySuccess++; }
      else { muscleStats[key].lateTotal++; if(met) muscleStats[key].lateSuccess++; }
    });
  });
  const insights = [];
  Object.entries(muscleStats).forEach(([muscle, s]) => {
    if (s.earlyTotal>=2 && s.lateTotal>=2 && s.names.size>=2) {
      const diff = (1-(s.lateSuccess/s.lateTotal)) - (1-(s.earlySuccess/s.earlyTotal));
      if (diff >= 0.3) insights.push({muscle, diff, exercises:[...s.names]});
    }
  });
  insights.sort((a,b)=>b.diff-a.diff);
  return insights;
}
function renderMuscleInsightsCard(){
  const insights = computeMuscleGroupInsights();
  if (insights.length === 0) return "";
  return `
    <div class="card">
      <p class="section-label" style="margin:0 0 8px;">🎯 部位ごとの傾向</p>
      ${insights.map(i => `

          <b style="color:var(--accent2);">${esc(i.muscle)}</b>: ${esc(i.exercises.join("・"))} が、複数種目にまたがって後半だと崩れがち。関連種目を早めに配置するのを検討してもいいかも
        </div>
      `).join("")}

    </div>
  `;
}
function computeReorderSuggestion(dow, variant){
  const p = program[dow];
  if (!p) return null;
  const list = variant === "exercises" ? p.exercises : p[variant];
  if (!list || list.length < 2) return null;
  const stats = list.map((ex, idx) => {
    const exMaster = exercises.find(e=>e.name===ex.name);
    const repsTarget = parseRepsTarget(ex.reps);
    const weightRange = parseTargetKgRange(ex.target);
    if (!exMaster || !repsTarget || !weightRange) return {name: ex.name, idx, sensitive:false, score:0};
    const conditions = load("ironlog_conditions", {});
    const dates = [...new Set(logs.filter(l=>l.exerciseId===exMaster.id).map(l=>l.date))]
      .filter(d => { const c = conditions[d]; return !(c && c<=2); })
      .filter(d => !isDateInDeloadWeek(d));
    let earlyTotal=0, earlySuccess=0, lateTotal=0, lateSuccess=0;
    dates.forEach(d => {
      const pos = getSessionPosition(d, exMaster.id);
      if (pos===null) return;
      const met = sessionAllMet(d, exMaster.id, repsTarget, weightRange.max);
      if (pos<=2) { earlyTotal++; if (met) earlySuccess++; }
      else { lateTotal++; if (met) lateSuccess++; }
    });
    let sensitive=false, score=0;
    if (earlyTotal>=2 && lateTotal>=2){
      const diff = (1-(lateSuccess/lateTotal)) - (1-(earlySuccess/earlyTotal));
      if (diff >= 0.34) { sensitive=true; score=diff; }
    }
    return {name: ex.name, idx, sensitive, score};
  });
  if (!stats.some(s=>s.sensitive)) return null;
  const sorted = stats.slice().sort((a,b)=>{
    if (a.sensitive !== b.sensitive) return a.sensitive ? -1 : 1;
    if (a.sensitive && b.sensitive) return b.score - a.score;
    return a.idx - b.idx;
  });
  const newOrderNames = sorted.map(s=>s.name);
  const currentOrderNames = list.map(l=>l.name);
  if (JSON.stringify(newOrderNames) === JSON.stringify(currentOrderNames)) return null;
  return { newOrderNames, sensitiveNames: stats.filter(s=>s.sensitive).map(s=>s.name) };
}
function applyReorder(dow, variant, newOrderNamesStr){
  const newOrderNames = newOrderNamesStr.split("|||");
  const p = program[dow];
  const list = variant === "exercises" ? p.exercises : p[variant];
  const byName = {};
  list.forEach(ex=>{ byName[ex.name] = ex; });
  const reordered = newOrderNames.map(n=>byName[n]).filter(Boolean);
  if (variant === "exercises") p.exercises = reordered;
  else {
    p[variant] = reordered;
    if (p.type === "main") {
      const other = variant === "heavy" ? "reps" : "heavy";
      const otherByName = {};
      (p[other]||[]).forEach(ex=>{ otherByName[ex.name]=ex; });
      const otherReordered = newOrderNames.map(n=>otherByName[n]).filter(Boolean);
      if (otherReordered.length === (p[other]||[]).length) p[other] = otherReordered;
    }
  }
  save("ironlog_program", program);
  const dismissed = load("ironlog_dismissed_reorder", {});
  delete dismissed[dow+"_"+variant];
  save("ironlog_dismissed_reorder", dismissed);
  showToast("並び順を更新した");
  render();
}
function dismissReorder(dow, variant, newOrderNamesStr){
  const dismissed = load("ironlog_dismissed_reorder", {});
  dismissed[dow+"_"+variant] = newOrderNamesStr;
  save("ironlog_dismissed_reorder", dismissed);
  render();
}
function renderReorderSuggestion(dow, variant){
  const s = computeReorderSuggestion(dow, variant);
  if (!s) return "";
  const sig = s.newOrderNames.join("|||");
  const dismissed = load("ironlog_dismissed_reorder", {});
  if (dismissed[dow+"_"+variant] === sig) return "";

}

function getDayOverride(dateStr){
  const v = load("ironlog_day_override", {})[dateStr];
  return (v===undefined || v===null) ? null : v;
}
function setDayOverride(dateStr, value){
  const o = load("ironlog_day_override", {});
  if (value === "" || value === null) delete o[dateStr]; else o[dateStr] = parseInt(value,10);
  save("ironlog_day_override", o);
  render();
}
function getEffectiveDow(dateStr){
  const override = getDayOverride(dateStr);
  if (override !== null) return override;
  return new Date(dateStr + "T00:00:00").getDay();
}
function programExercisesForDate(dateStr){
  const dow = getEffectiveDow(dateStr);
  const p = program[dow];
  if (!p || p.type === "rest") return [];
  if (p.type === "light") return (p.exercises||[]).map(e=>e.name);
  if (p.type === "main") {
    const wt = getWeekTypeForDate(dateStr);
    return (wt === "heavy" ? p.heavy : p.reps).map(e=>e.name);
  }
  return [];
}
function getWeekTypeForDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const wk = weekKeyFor(d);
  if (wk === window.__weekKey) return window.__weekType;
  return defaultWeekTypeFor(d);
}

const BACKUP_KEYS = [
  "ironlog_exercises", "ironlog_logs", "ironlog_program", "ironlog_weektype",
  "ironlog_dismissed_suggestions", "ironlog_dismissed_reorder", "ironlog_celebrated",
  "ironlog_dismissed_summary", "ironlog_conditions", "ironlog_memos",

  "ironlog_deload_weeks",
];
function exportData(){
  const payload = { exportedAt: new Date().toISOString(), data: {} };
  BACKUP_KEYS.forEach(key => {
    const raw = localStorage.getItem(key);
    if (raw !== null) { try { payload.data[key] = JSON.parse(raw); } catch(e) { payload.data[key] = raw; } }
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "iron-log-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("全データをバックアップした");
}

function importData(fileInput){
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const isNewFormat = !!parsed.data;
      const dataMap = isNewFormat ? parsed.data : parsed;
      let normalized = {};
      if (isNewFormat) {
        normalized = dataMap;
      } else {
        if (dataMap.exercises) normalized.ironlog_exercises = dataMap.exercises;
        if (dataMap.logs) normalized.ironlog_logs = dataMap.logs;
        if (dataMap.program) normalized.ironlog_program = dataMap.program;
        if (dataMap.weekType) normalized.ironlog_weektype = dataMap.weekType;
      }
      if (!normalized.ironlog_exercises && !normalized.ironlog_logs) { showToast("ファイルの形式が違うかも"); return; }
      pendingImport = normalized;
      importSelectedKeys = new Set(Object.keys(normalized));
      render();
    } catch(err) {
      showToast("読み込みエラー");
    }
  };
  reader.readAsText(file);
  fileInput.value = "";
}
function toggleImportCategory(catIdx){
  const cat = IMPORT_CATEGORIES[catIdx];
  const allSelected = cat.keys.every(k => importSelectedKeys.has(k));
  if (allSelected) cat.keys.forEach(k => importSelectedKeys.delete(k));
  else cat.keys.forEach(k => { if (pendingImport[k] !== undefined) importSelectedKeys.add(k); });
  render();
}
function confirmImport(){
  if (!pendingImport) return;
  importSelectedKeys.forEach(key => {

  exercises = load("ironlog_exercises", exercises);

  selectedExId = exercises[0] ? exercises[0].id : null;

}

function isExcusedDate(dateStr){ return load("ironlog_excused_days", []).includes(dateStr); }
function toggleExcused(dateStr){
  const arr = load("ironlog_excused_days", []);
  const idx = arr.indexOf(dateStr);
  if (idx === -1) {

  } else {

function computeStreak(){
  let streak = 0;
  let d = new Date();
  d.setHours(0,0,0,0);
  const startGuard = new Date(d);
  for (let i=0; i<3650; i++) {
    const dow = d.getDay();
    const dateStr = localDateStr(d);
    const p = program[dow];
    const isToday = dateStr === todayStr();
    if (p && p.type !== "rest" && !isExcusedDate(dateStr)) {
      const hasLog = logs.some(l => l.date === dateStr);
      if (hasLog) {
        streak++;
      } else if (!isToday) {
        break;
      }
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function checkMilestoneCelebration(streak){
  if (streak!==7 && streak!==30) { window.__celebrate = false; return; }
  const celebrated = load("ironlog_celebrated", []);
  if (celebrated.includes(streak)) { window.__celebrate = false; return; }
  window.__celebrate = streak;
  celebrated.push(streak);
  save("ironlog_celebrated", celebrated);
}

function buildHeatmapCells(periodDays){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = localDateStr(today);
  let rangeStart;
  if (periodDays) {
    rangeStart = new Date(today); rangeStart.setDate(rangeStart.getDate()-periodDays+1);
  } else {
    const allDates = logs.map(l=>l.date).sort();
    rangeStart = allDates.length ? new Date(allDates[0]+"T00:00:00") : new Date(today);
  }
  const gridStart = new Date(rangeStart);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const cells = [];
  let d = new Date(gridStart);
  let guard = 0;
  while (d <= today && guard < 400) {
    const dateStr = localDateStr(d);
    const dow = d.getDay();
    const p = program[dow];
    const beforeRange = d < rangeStart;
    let status = "pad";
    if (!beforeRange) {
      if (!p || p.type === "rest") status = "rest";
      else if (isExcusedDate(dateStr)) status = "excused";
      else {
        const hasLog = logs.some(l=>l.date===dateStr);
        if (hasLog) status = "done";
        else if (dateStr === todayKey) status = "today";
        else status = "missed";
      }
    }
    cells.push({date: dateStr, status});
    d.setDate(d.getDate()+1);
    guard++;
  }
  return cells;
}
function selectHeatmapDay(dateStr){
  heatmapSelectedDate = (heatmapSelectedDate === dateStr) ? null : dateStr;
  render();
}
function renderHeatmapHTML(periodDays){
  const cells = buildHeatmapCells(periodDays);
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  let prevMonth = null;
  let labelsHtml = `<div style="display:flex; gap:3px;">`;
  let gridHtml = `<div style="display:flex; gap:3px;">`;
  weeks.forEach(week => {
    const firstReal = week.find(c => c.status !== "pad");
    let label = "";
    if (firstReal) {
      const monthNum = new Date(firstReal.date+"T00:00:00").getMonth()+1;
      if (monthNum !== prevMonth) { label = monthNum+"月"; prevMonth = monthNum; }
    }
    labelsHtml += `<div style="width:11px; font-size:9px; color:var(--text-muted); flex-shrink:0; white-space:nowrap; overflow:visible;">${label}</div>`;
    gridHtml += `<div style="display:flex; flex-direction:column; gap:3px; flex-shrink:0;">`;
    week.forEach(c => {
      if (c.status === "pad") { gridHtml += `<div style="width:11px; height:11px;"></div>`; return; }
      let bg = "transparent", border = "1px solid #33302B";
      if (c.status === "done") { bg = "#C1442A"; border = "1px solid #C1442A"; }
      else if (c.status === "rest") { bg = "#2A2724"; border = "1px solid #2A2724"; }
      else if (c.status === "missed") { bg = "transparent"; border = "1px solid #C1442A"; }
      else if (c.status === "today") { bg = "transparent"; border = "1px dashed #B9905A"; }
      else if (c.status === "excused") { bg = "#3A342C"; border = "1px dotted #A79C89"; }
      const isSelected = heatmapSelectedDate === c.date;
      const sel = isSelected ? "outline:2px solid #F2ECE1; outline-offset:1px;" : "";
      gridHtml += `<div onclick="selectHeatmapDay('${c.date}')" style="width:11px; height:11px; border-radius:2px; background:${bg}; border:${border}; cursor:pointer; ${sel}"></div>`;
    });
    gridHtml += `</div>`;
  });
  labelsHtml += `</div>`;
  gridHtml += `</div>`;
  return `<div style="overflow-x:auto; padding-bottom:6px;"><div style="display:inline-block;">${labelsHtml}${gridHtml}</div></div>`;
}

  return `<div style="margin-top:8px; padding:8px 10px; background:var(--surface-alt); border-radius:8px;"><p style="margin:0 0 4px; font-size:12px; font-weight:700; color:var(--accent2);">${dateLabel} ${extra}</p>${body}</div>`;
}
function renderHeatmapCard(){
  const periodDays = heatmapPeriod==="3m" ? 90 : heatmapPeriod==="6m" ? 180 : null;
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <p class="section-label" style="margin:0;">トレ記録カレンダー</p>
        <div style="display:flex; gap:4px;">
          <button class="period-btn ${heatmapPeriod==='3m'?'period-active':''}" onclick="setHeatmapPeriod('3m')">3ヶ月</button>
          <button class="period-btn ${heatmapPeriod==='6m'?'period-active':''}" onclick="setHeatmapPeriod('6m')">半年</button>
          <button class="period-btn ${heatmapPeriod==='all'?'period-active':''}" onclick="setHeatmapPeriod('all')">全期間</button>
        </div>
      </div>
      ${renderHeatmapHTML(periodDays)}
      <div style="display:flex; gap:12px; font-size:10px; color:var(--text-muted); margin-top:6px; flex-wrap:wrap;">
        <span>🟧 トレした</span><span>⬜ 予定してたのに未記録</span><span>┄ 今日(まだ)</span><span>▪ 休養日</span><span>┈ 仕方ない日</span>
      </div>
      ${renderHeatmapDetail()}
    </div>
  `;
}

function buildLineSVG(labels, seriesList, height){
  height = height || 180;
  const width=340, padL=32, padR=10, padT=Math.round(height*0.1), padB=Math.round(height*0.15);
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const allVals = seriesList.flatMap(s=>s.data).filter(v=>v!==null && v!==undefined);
  if (allVals.length===0) return '<p class="empty" style="padding:16px 0;">データなし</p>';
  let minV = Math.min(...allVals), maxV = Math.max(...allVals);
  if (minV===maxV) { minV -= 2; maxV += 2; } else { const pad=(maxV-minV)*0.2; minV-=pad; maxV+=pad; }
  const n = labels.length;
  const xPos = i => n<=1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const yPos = v => padT + (1-(v-minV)/(maxV-minV))*plotH;
  const fs = height < 140 ? 7 : 8;
  let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:${height}px; display:block;">`;
  for (let g=0; g<=2; g++){
    const gy = padT + (g/2)*plotH;
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="#42392F" stroke-width="1"/>`;
  }
  seriesList.forEach(s => {
    let segs = [], current = [];
    s.data.forEach((v,i) => {
      if (v===null || v===undefined) { if (current.length) { segs.push(current); current=[]; } }
      else current.push([xPos(i), yPos(v)]);
    });
    if (current.length) segs.push(current);
    segs.forEach(seg => {
      const d = seg.map((p,idx)=> (idx===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    });
    s.data.forEach((v,i) => {
      if (v===null || v===undefined) return;
      const cx=xPos(i), cy=yPos(v);
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.5" fill="${s.color}"/>`;
      svg += `<text x="${cx.toFixed(1)}" y="${(cy-5).toFixed(1)}" font-size="${fs}" fill="${s.color}" text-anchor="middle">${v}</text>`;
    });
  });
  const step = Math.max(1, Math.ceil(n/6));
  labels.forEach((lab,i) => {
    if (i % step !== 0 && i !== n-1) return;
    svg += `<text x="${xPos(i).toFixed(1)}" y="${height-6}" font-size="${fs}" fill="#A79C89" text-anchor="middle">${esc(lab)}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderExerciseChartCard(ex){
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length === 0) {
    return `<div class="card" style="padding:12px 16px;"><p class="section-label" style="margin:0;">${esc(ex.name)}</p><p class="hint" style="margin:4px 0 0;">記録なし</p></div>`;
  }
  const dates = [...new Set(exLogs.map(l=>l.date))].sort();
  const labels = dates.map(d=>d.slice(5));
  const latestDate = dates[dates.length-1];
  const latest = exLogs.filter(l=>l.date===latestDate).reduce((best,l)=> isBetterSet(l,best) ? l : best, null);
  let seriesList, legendHtml;
  if (ex.unilateral) {
    const byKey = {};
    exLogs.forEach(l=>{
      const k = l.date+"_"+(l.side||"L");
      if (isBetterSet(l, byKey[k])) byKey[k] = l;
    });
    seriesList = [
      {data: dates.map(d=>byKey[d+"_L"]?byKey[d+"_L"].weight:null), color:"#C1442A"},
      {data: dates.map(d=>byKey[d+"_R"]?byKey[d+"_R"].weight:null), color:"#B9905A"},
    ];
    legendHtml = `<span>🔴左</span><span>🟡右</span>`;
  } else {
    const byDate = {};
    exLogs.forEach(l=>{
      if (isBetterSet(l, byDate[l.date])) byDate[l.date] = l;
    });
    seriesList = [
      {data: dates.map(d=>getWeekTypeForDate(d)==="heavy"?byDate[d].weight:null), color:"#C1442A"},
      {data: dates.map(d=>getWeekTypeForDate(d)==="reps"?byDate[d].weight:null), color:"#B9905A"},
    ];
    legendHtml = `<span>🔴重量週</span><span>🟡回数週</span>`;
  }
  const svg = buildLineSVG(labels, seriesList, 100);
  const prLine = ex.unilateral
    ? [["左", getAllTimeMax(ex.id,"L")], ["右", getAllTimeMax(ex.id,"R")]]
        .filter(([,v])=>v!==null).map(([lab,v])=>`🏆${lab}${v}kg`).join(" ")
    : (() => { const v = getAllTimeMax(ex.id, null); return v!==null ? `🏆 自己ベスト ${v}kg` : ""; })();
  const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30);
  const flagCount = exLogs.filter(l=>l.flag && new Date(l.date+"T00:00:00") >= thirtyDaysAgo).length;
  const flagLine = flagCount >= 2 ? `<p style="margin:0 0 4px; font-size:10.5px; color:#D97757;">⚠️ 違和感フラグ: 直近30日で${flagCount}回</p>` : "";
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <p class="section-label" style="margin:0;">${esc(ex.name)}${latest.side?` <span style="color:var(--accent2);">(直近:${latest.side==="L"?"左":"右"})</span>`:""}</p>
        <p style="margin:0; font-family:ui-monospace,monospace; font-weight:800; color:var(--accent); font-size:15px;">${latest.weight}kg</p>
      </div>
      ${prLine ? `<p style="margin:0 0 4px; font-size:10.5px; color:var(--accent2);">${esc(prLine)}</p>` : ""}
      ${flagLine}
      ${svg}
      <div style="display:flex; gap:10px; font-size:10px; color:var(--text-muted); margin-top:2px;">${legendHtml}</div>
    </div>
  `;
}

function metricChangeLabel(values){
  const withVals = values.filter(v=>v!==null);
  if (withVals.length < 2) return "";
  const diff = withVals[withVals.length-1] - withVals[0];
  const sign = diff > 0 ? "+" : "";
  return ` <span style="color:${diff<0?'#7FA87F':diff>0?'var(--accent2)':'var(--text-muted)'};">(${sign}${diff.toFixed(1)})</span>`;
}
function computeBodyCompComment(metrics){
  const dates = Object.keys(metrics).sort();
  const bfEntries = dates.filter(d=>metrics[d].bodyFat!=null).map(d=>({date:d, v:metrics[d].bodyFat}));
  const mmEntries = dates.filter(d=>metrics[d].muscleMass!=null).map(d=>({date:d, v:metrics[d].muscleMass}));
  if (bfEntries.length < 2 && mmEntries.length < 2) return null;
  const bfDiff = bfEntries.length>=2 ? bfEntries[bfEntries.length-1].v - bfEntries[0].v : null;
  const mmDiff = mmEntries.length>=2 ? mmEntries[mmEntries.length-1].v - mmEntries[0].v : null;
  if (bfDiff!==null && mmDiff!==null) {
    if (bfDiff < -0.3 && mmDiff >= -0.2) return "✅ 順調にリコンプできてそう(体脂肪率↓・筋肉量は維持〜増加)";
    if (bfDiff < -0.3 && mmDiff < -0.2) return "⚠️ 体脂肪と一緒に筋肉量も落ちてきてるかも。カロリーをやや上げるのも検討してもいいかも";
    if (bfDiff >= 0.3 && mmDiff > 0.2) return "📈 筋肉量も体脂肪率も増加傾向。バルク寄りの推移";
    if (Math.abs(bfDiff) < 0.3 && mmDiff > 0.2) return "✅ 体脂肪率はほぼ変わらず筋肉量が増加。良いペース";
    return "様子見でOK、大きな変化はまだ見えてない";
  }
  if (bfDiff !== null) return bfDiff < -0.3 ? "体脂肪率が減少傾向" : bfDiff > 0.3 ? "体脂肪率が増加傾向" : "体脂肪率は横ばい";
  if (mmDiff !== null) return mmDiff > 0.2 ? "筋肉量が増加傾向" : mmDiff < -0.2 ? "筋肉量が減少傾向" : "筋肉量は横ばい";
  return null;
}
function renderBodyMetricsCard(){
  const metrics = load("ironlog_body_metrics", {});
  const dates = Object.keys(metrics).sort();
  if (dates.length === 0) return "";
  const labels = dates.map(d=>d.slice(5));
  const weights = dates.map(d=> metrics[d].weight ?? null);
  const waists = dates.map(d=> metrics[d].waist ?? null);
  const bodyFats = dates.map(d=> metrics[d].bodyFat ?? null);
  const muscleMasses = dates.map(d=> metrics[d].muscleMass ?? null);
  const hasWeight = weights.some(v=>v!==null);
  const hasWaist = waists.some(v=>v!==null);
  const hasBodyFat = bodyFats.some(v=>v!==null);
  const hasMuscle = muscleMasses.some(v=>v!==null);
  if (!hasWeight && !hasWaist && !hasBodyFat && !hasMuscle) return "";
  let html = `<div class="card"><p class="section-label" style="margin:0 0 8px;">📉 体組成の推移</p>`;
  const comment = computeBodyCompComment(metrics);
  if (comment) html += `<div style="background:var(--surface-alt); border-radius:8px; padding:8px 10px; margin-bottom:10px; font-size:12px;">${esc(comment)}</div>`;
  if (hasWeight) html += `<p class="hint" style="margin:0 0 2px;">体重(kg)${metricChangeLabel(weights)}</p>` + buildLineSVG(labels, [{data:weights, color:"#C1442A"}], 100);
  if (hasBodyFat) html += `<p class="hint" style="margin:8px 0 2px;">体脂肪率(%)${metricChangeLabel(bodyFats)}</p>` + buildLineSVG(labels, [{data:bodyFats, color:"#B9905A"}], 100);
  if (hasMuscle) html += `<p class="hint" style="margin:8px 0 2px;">筋肉量(kg)${metricChangeLabel(muscleMasses)}</p>` + buildLineSVG(labels, [{data:muscleMasses, color:"#7FA87F"}], 100);
  if (hasWaist) html += `<p class="hint" style="margin:8px 0 2px;">ウェスト(cm)${metricChangeLabel(waists)}</p>` + buildLineSVG(labels, [{data:waists, color:"#8B8BC4"}], 100);
  html += `<p class="hint" style="margin-top:4px;">()内は初回記録からの変化量</p>`;
  html += `</div>`;
  return html;
}
function renderChartTab(){
  const streak = computeStreak();
  checkMilestoneCelebration(streak);
  let html = renderStreakCard(streak);
  html += renderWeeklyReviewCard();
  html += renderHeatmapCard();
  html += renderVolumeBalanceCard();
  html += renderBodyMetricsCard();
  html += renderMuscleInsightsCard();
  html += `<p class="section-label" style="margin-top:4px;">種目ごとの推移</p>`;
  html += exercises.map(renderExerciseChartCard).join("");
  return html;
}

function render(){
  const app = document.getElementById("app");
  if (tab === "log") app.innerHTML = renderLogTab();
  else if (tab === "week") app.innerHTML = renderWeekTab();
  else if (tab === "exercises") app.innerHTML = renderExercisesTab();
  else if (tab === "chart") app.innerHTML = renderChartTab();
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}
render();
</script>
