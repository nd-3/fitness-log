<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">

<title>IRON LOG - 筋トレ記録</title>
<style>

  .today-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  .toggle-btn { display: flex; align-items: center; gap: 4px; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; }
  .today-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .ex-row-wrap { display: flex; align-items: stretch; gap: 6px; margin-bottom: 6px; }
  .ex-row { display: flex; flex-direction: column; background: var(--surface); border-radius: 10px; padding: 9px 11px; cursor: pointer; border: none; flex: 1; min-width: 0; text-align: left; color: var(--text); font-family: inherit; }

  .ex-row-top span:first-child { font-size: 13.5px; }
  .ex-row .target { font-size: 11.5px; color: var(--accent2); font-family: ui-monospace, monospace; white-space: nowrap; margin-left: 8px; text-align: right; line-height: 1.5; }

  .muscle-line { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .video-btn { display: flex; align-items: center; justify-content: center; width: 38px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--accent2); font-size: 14px; cursor: pointer; }

  label.field-label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  select, input { width: 100%; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; }
  input[type=number] { font-family: ui-monospace, monospace; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-primary { width: 100%; margin-top: 10px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .log-item .name { font-size: 13.5px; font-weight: 600; margin: 0; }
  .log-item .stat { font-size: 12px; color: var(--accent2); font-family: ui-monospace, monospace; margin: 2px 0 0; }
  .del-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 14px; }
  .section-label { font-size: 11.5px; color: var(--text-muted); margin: 0 2px 8px; }

  nav.tabbar button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10.5px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
  nav.tabbar button.active { color: var(--accent); }

  .day-head { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .day-name { font-weight: 700; font-size: 14px; }
  .day-type-badge { font-size: 11px; color: var(--accent2); margin-left: 8px; }

  .ex-edit-row { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 6px; }

  .ex-edit-row .field { margin-bottom: 6px; }
  .backup-row { display: flex; gap: 8px; margin-top: 8px; }
  .backup-btn { flex: 1; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; text-align: center; }
  .suggest-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-top: 6px; padding: 6px 8px; background: rgba(193,68,42,0.12); border: 1px solid var(--accent); border-radius: 8px; font-size: 11px; color: var(--text); flex-wrap: wrap; }

  .memo-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .memo-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .memo-body { font-size: 12.5px; color: var(--text-muted); line-height: 1.7; margin-top: 10px; }
  .memo-body b { color: var(--text); }
  .sw-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .sw-display { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 800; color: var(--accent); min-width: 62px; }
  .sw-btn { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  .side-row { display: flex; gap: 8px; }
  .side-btn { flex: 1; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px; padding: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .side-btn.side-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .period-btn { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 5px 9px; font-size: 11px; cursor: pointer; }
  .period-btn.period-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  @keyframes popCelebrate { 0%{opacity:0; transform:scale(0.6) translateY(4px);} 40%{opacity:1; transform:scale(1.12);} 100%{opacity:1; transform:scale(1);} }
  .celebrate-badge { animation: popCelebrate 0.6s ease; }
  .streak-num { font-size: 38px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--accent); margin: 4px 0; }
</style>

<body>

const DEFAULT_EXERCISES_META = [
  {name:"ゴブレットスクワット", primary:"大腿四頭筋", secondary:"臀筋・体幹", unilateral:false},

  {name:"ルーマニアンデッドリフト", primary:"ハムストリングス", secondary:"臀筋・脊柱起立筋", unilateral:false},
  {name:"ベントオーバーロウ", primary:"広背筋", secondary:"僧帽筋・上腕二頭筋", unilateral:false},
  {name:"ブルガリアンスプリットスクワット", primary:"大腿四頭筋", secondary:"臀筋", unilateral:true},
  {name:"インクラインダンベルプレス", primary:"大胸筋上部", secondary:"三角筋前部・上腕三頭筋", unilateral:false},
  {name:"ラテラルレイズ", primary:"三角筋中部", secondary:"", unilateral:false},
  {name:"シングルアームロウ", primary:"広背筋", secondary:"僧帽筋・上腕二頭筋", unilateral:true},
  {name:"アームカール", primary:"上腕二頭筋", secondary:"前腕", unilateral:false},
  {name:"ヒップリフト", primary:"臀筋", secondary:"ハムストリングス", unilateral:false},
  {name:"プランク", primary:"腹直筋・体幹", secondary:"", unilateral:false},
  {name:"サイドプランク", primary:"腹斜筋", secondary:"", unilateral:false},
  {name:"マウンテンクライマー", primary:"体幹", secondary:"心肺(有酸素)", unilateral:false},
  {name:"腹筋ローラー", primary:"腹直筋", secondary:"広背筋・肩", unilateral:false},
  {name:"ダンベルトライセップスエクステンション", primary:"上腕三頭筋", secondary:"", unilateral:false},
  {name:"ベントオーバーリアレイズ", primary:"三角筋後部", secondary:"僧帽筋", unilateral:false},
  {name:"ダンベルプルオーバー", primary:"広背筋", secondary:"大胸筋・上腕三頭筋", unilateral:false},
  {name:"インクラインダンベルカール", primary:"上腕二頭筋", secondary:"", unilateral:false},
  {name:"ダンベルサイドベンド", primary:"腹斜筋", secondary:"", unilateral:true},
  {name:"ダンベルフライ", primary:"大胸筋", secondary:"三角筋前部", unilateral:false},
];

function uid(p){ return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7); }
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayStr(){ return localDateStr(new Date()); }
function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + (day===0 ? -6 : 1-day));
  date.setHours(0,0,0,0);
  return date;
}
function weekKeyFor(d){ return localDateStr(mondayOf(d)); }
function defaultWeekTypeFor(d){
  const REF = new Date("2026-08-10T00:00:00");
  const diffWeeks = Math.round((mondayOf(d)-REF)/(7*86400000));
  return diffWeeks % 2 === 0 ? "heavy" : "reps";
}
function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ showToast("保存エラー"); }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let exercises = load("ironlog_exercises", DEFAULT_EXERCISES_META.map((m,i)=>({id:"ex_"+i, name:m.name, primary:m.primary, secondary:m.secondary, unilateral:!!m.unilateral})));
let logs = load("ironlog_logs", []);
let program = load("ironlog_program", DEFAULT_PROGRAM);

function collectProgramExerciseNames(){
  const names = [];
  Object.values(program).forEach(p => {
    if (!p) return;
    if (p.type === "light") (p.exercises||[]).forEach(e=>{ if (e.name) names.push(e.name); });
    if (p.type === "main") {
      (p.heavy||[]).forEach(e=>{ if (e.name) names.push(e.name); });
      (p.reps||[]).forEach(e=>{ if (e.name) names.push(e.name); });
    }
  });
  return names;
}
function syncExercisesWithProgram(){
  const names = collectProgramExerciseNames();
  let changed = false;
  names.forEach(n => {
    if (!exercises.find(e=>e.name===n)) {
      const meta = DEFAULT_EXERCISES_META.find(m=>m.name===n);
      exercises.push({id: uid("ex"), name:n, primary: meta?meta.primary:"", secondary: meta?meta.secondary:"", unilateral: meta?!!meta.unilateral:false});
      changed = true;
    }
  });
  if (changed) save("ironlog_exercises", exercises);
}
syncExercisesWithProgram();

let tab = "log";
let selectedExId = exercises[0] ? exercises[0].id : null;
let form = { date: todayStr() };
let editingDay = null;
let showMemo = false;
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swIntervalId = null;
let logFilterMode = "today";
let logSide = "L";
let heatmapPeriod = "3m";
let heatmapSelectedDate = null;

(function initWeekType(){
  const now = new Date();
  const todayKey = weekKeyFor(now);
  const savedWT = load("ironlog_weektype", null);
  let wt = defaultWeekTypeFor(now);
  if (savedWT && savedWT.weekKey === todayKey) wt = savedWT.type;
  save("ironlog_weektype", {weekKey: todayKey, type: wt});
  window.__weekType = wt;
  window.__weekKey = todayKey;
})();

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; }, 1500);
}
function setTab(t){ tab = t; render(); }
function toggleWeekType(){
  window.__weekType = window.__weekType === "heavy" ? "reps" : "heavy";
  save("ironlog_weektype", {weekKey: window.__weekKey, type: window.__weekType});
  render();
}
function openVideoSearch(name){
  const q = encodeURIComponent(name + " ダンベル フォーム 正しいやり方");
  window.open("https://www.youtube.com/results?search_query=" + q, "_blank");
}
function pickExerciseByName(name){
  const found = exercises.find(e=>e.name===name);
  if (found) selectedExId = found.id;
  tab = "log";
  render();
}
function addExercise(){
  const val = document.getElementById("newExInput").value.trim();
  if(!val) return;
  exercises = [...exercises, {id: uid("ex"), name: val, primary:"", secondary:"", unilateral:false}];
  save("ironlog_exercises", exercises);
  render();
}
function deleteExercise(id){
  exercises = exercises.filter(e=>e.id!==id);
  save("ironlog_exercises", exercises);
  if (selectedExId===id) selectedExId = exercises[0] ? exercises[0].id : null;
  render();
}
function updateExerciseMeta(id, field, value){
  const ex = exercises.find(e=>e.id===id);
  if (!ex) return;
  ex[field] = value;
  save("ironlog_exercises", exercises);
}
function toggleUnilateral(id, checked){
  const ex = exercises.find(e=>e.id===id);
  if (!ex) return;
  ex.unilateral = checked;
  save("ironlog_exercises", exercises);

function groupTodaysLogs(sortedLogs){
  const seen = new Map();
  const order = [];
  sortedLogs.forEach(l => {
    const key = `${l.exerciseId}::${l.weight}::${l.reps}::${l.side||""}`;
    if (!seen.has(key)) {
      const g = {exerciseId:l.exerciseId, weight:l.weight, reps:l.reps, side:l.side, sets:0, ids:[], setNumbers:[]};
      seen.set(key, g);
      order.push(g);
    }
    const g = seen.get(key);
    g.sets += l.sets;
    g.ids.push(l.id);
    if (l.setNumber) g.setNumbers.push(l.setNumber);
  });
  order.forEach(g => g.setNumbers.sort((a,b)=>a-b));
  return order;
}

function parseTargetKgRange(target){
  if (!target) return null;
  const nums = target.match(/\d+(\.\d+)?/g);
  if (!nums) return null;
  const vals = nums.map(Number);
  return { min: Math.min(...vals), max: Math.max(...vals) };
}
function parseRepsTarget(reps){
  if (!reps || reps.indexOf("秒") !== -1) return null;
  const m = reps.match(/^(\d+)回/);
  return m ? parseInt(m[1],10) : null;
}
function isBetterSet(candidate, current){
  if (!current) return true;
  if (candidate.weight !== current.weight) return candidate.weight > current.weight;
  return candidate.reps > current.reps;
}
function getLastLogForExerciseName(name){
  const ex = exercises.find(e=>e.name===name);
  if (!ex) return null;
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length === 0) return null;
  const mostRecentDate = exLogs.map(l=>l.date).sort().pop();
  const dayLogs = exLogs.filter(l=>l.date===mostRecentDate);
  return dayLogs.reduce((best,l)=> isBetterSet(l,best) ? l : best, null);
}
function getRecentSessionDates(exerciseId, n){
  const conditions = load("ironlog_conditions", {});
  const dates = [...new Set(logs.filter(l=>l.exerciseId===exerciseId).map(l=>l.date))]
    .filter(d => { const c = conditions[d]; return !(c && c<=2); })
    .sort().reverse();
  return dates.slice(0, n);
}
function sessionAllMet(date, exerciseId, repsTarget, weightMax){
  const dayLogs = logs.filter(l=>l.exerciseId===exerciseId && l.date===date);
  if (dayLogs.length === 0) return false;
  return dayLogs.every(l => l.reps >= repsTarget && l.weight >= weightMax);
}
function sessionMostlyFailed(date, exerciseId, repsTarget, weightMin){
  const dayLogs = logs.filter(l=>l.exerciseId===exerciseId && l.date===date && l.weight >= weightMin);
  if (dayLogs.length === 0) return false;
  const failCount = dayLogs.filter(l => l.reps < repsTarget).length;
  return failCount > dayLogs.length / 2;
}
function getSessionPosition(date, exerciseId){
  const dayLogs = logs.filter(l=>l.date===date);
  if (dayLogs.length === 0) return null;
  const firstTs = {};
  dayLogs.forEach(l => {
    const t = l.timestamp || 0;
    if (!(l.exerciseId in firstTs) || t < firstTs[l.exerciseId]) firstTs[l.exerciseId] = t;
  });
  const order = Object.keys(firstTs).sort((a,b)=>firstTs[a]-firstTs[b]);
  const idx = order.indexOf(exerciseId);
  return idx === -1 ? null : idx + 1;
}
function getTypicalPosition(exerciseId, excludeDates){
  const dates = [...new Set(logs.filter(l=>l.exerciseId===exerciseId).map(l=>l.date))].filter(d=>!excludeDates.includes(d));
  const positions = dates.map(d=>getSessionPosition(d, exerciseId)).filter(p=>p!==null).sort((a,b)=>a-b);
  if (positions.length === 0) return null;
  const mid = Math.floor(positions.length/2);
  return positions.length % 2 ? positions[mid] : (positions[mid-1]+positions[mid])/2;
}
function positionNote(exerciseId, recentDates){
  const lastDate = recentDates[0];
  const pos = getSessionPosition(lastDate, exerciseId);
  const typical = getTypicalPosition(exerciseId, recentDates);
  if (pos === null || typical === null) return "";
  if (pos - typical >= 2) return "(いつもよりだいぶ後の種目だった。疲労の影響もあるかも)";
  if (typical - pos >= 2) return "(いつもよりだいぶ早い種目だった。フレッシュな状態での結果)";
  return "";
}
function applySuggestedWeight(dow, variant, idx, newWeight){

  const arr = variant === "exercises" ? p.exercises : p[variant];

  const prefixMatch = ex.target.match(/^([^\d]*)/);
  const prefix = prefixMatch ? prefixMatch[1] : "";
  ex.target = `${prefix}${newWeight}kg`;
  save("ironlog_program", program);
  showToast(ex.name + "の目安を更新した");
  render();
}
function isSuggestionDismissed(key){

}

function circleNum(n){
  const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
  return circled[n-1] || `(${n})`;
}
function renderLastSessionBreakdown(name, unilateral){
  const ex = exercises.find(e=>e.name===name);
  if (!ex) return "";
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length===0) return "";
  const lastDate = exLogs.map(l=>l.date).sort().pop();
  const dayLogs = exLogs.filter(l=>l.date===lastDate);
  const fmt = arr => arr.map((l,i)=>`${circleNum(l.setNumber||i+1)}${l.weight}kg×${l.reps}`).join(" ");
  let out = "";
  if (unilateral) {
    const left = dayLogs.filter(l=>(l.side||"L")==="L").sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    const right = dayLogs.filter(l=>l.side==="R").sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    if (left.length) out += `左 ${fmt(left)}`;
    if (right.length) out += `${out?" / ":""}右 ${fmt(right)}`;
  } else {
    const sorted = dayLogs.slice().sort((a,b)=>(a.setNumber||0)-(b.setNumber||0));
    out = fmt(sorted);
  }
  return out ? `<div class="muscle-line">📝 前回(${lastDate.slice(5)}): ${out}</div>` : "";
}

function computeReorderSuggestion(dow, variant){
  const p = program[dow];
  if (!p) return null;
  const list = variant === "exercises" ? p.exercises : p[variant];
  if (!list || list.length < 2) return null;
  const stats = list.map((ex, idx) => {
    const exMaster = exercises.find(e=>e.name===ex.name);
    const repsTarget = parseRepsTarget(ex.reps);
    const weightRange = parseTargetKgRange(ex.target);
    if (!exMaster || !repsTarget || !weightRange) return {name: ex.name, idx, sensitive:false, score:0};
    const dates = [...new Set(logs.filter(l=>l.exerciseId===exMaster.id).map(l=>l.date))];
    let earlyTotal=0, earlySuccess=0, lateTotal=0, lateSuccess=0;
    dates.forEach(d => {
      const pos = getSessionPosition(d, exMaster.id);
      if (pos===null) return;
      const met = sessionAllMet(d, exMaster.id, repsTarget, weightRange.max);
      if (pos<=2) { earlyTotal++; if (met) earlySuccess++; }
      else { lateTotal++; if (met) lateSuccess++; }
    });
    let sensitive=false, score=0;
    if (earlyTotal>=2 && lateTotal>=2){
      const diff = (1-(lateSuccess/lateTotal)) - (1-(earlySuccess/earlyTotal));
      if (diff >= 0.34) { sensitive=true; score=diff; }
    }
    return {name: ex.name, idx, sensitive, score};
  });
  if (!stats.some(s=>s.sensitive)) return null;
  const sorted = stats.slice().sort((a,b)=>{
    if (a.sensitive !== b.sensitive) return a.sensitive ? -1 : 1;
    if (a.sensitive && b.sensitive) return b.score - a.score;
    return a.idx - b.idx;
  });
  const newOrderNames = sorted.map(s=>s.name);
  const currentOrderNames = list.map(l=>l.name);
  if (JSON.stringify(newOrderNames) === JSON.stringify(currentOrderNames)) return null;
  return { newOrderNames, sensitiveNames: stats.filter(s=>s.sensitive).map(s=>s.name) };
}
function applyReorder(dow, variant, newOrderNamesStr){
  const newOrderNames = newOrderNamesStr.split("|||");
  const p = program[dow];
  const list = variant === "exercises" ? p.exercises : p[variant];
  const byName = {};
  list.forEach(ex=>{ byName[ex.name] = ex; });
  const reordered = newOrderNames.map(n=>byName[n]).filter(Boolean);
  if (variant === "exercises") p.exercises = reordered;
  else {
    p[variant] = reordered;
    if (p.type === "main") {
      const other = variant === "heavy" ? "reps" : "heavy";
      const otherByName = {};
      (p[other]||[]).forEach(ex=>{ otherByName[ex.name]=ex; });
      const otherReordered = newOrderNames.map(n=>otherByName[n]).filter(Boolean);
      if (otherReordered.length === (p[other]||[]).length) p[other] = otherReordered;
    }
  }
  save("ironlog_program", program);
  const dismissed = load("ironlog_dismissed_reorder", {});
  delete dismissed[dow+"_"+variant];
  save("ironlog_dismissed_reorder", dismissed);
  showToast("並び順を更新した");
  render();
}
function dismissReorder(dow, variant, newOrderNamesStr){
  const dismissed = load("ironlog_dismissed_reorder", {});
  dismissed[dow+"_"+variant] = newOrderNamesStr;
  save("ironlog_dismissed_reorder", dismissed);
  render();
}
function renderReorderSuggestion(dow, variant){
  const s = computeReorderSuggestion(dow, variant);
  if (!s) return "";
  const sig = s.newOrderNames.join("|||");
  const dismissed = load("ironlog_dismissed_reorder", {});
  if (dismissed[dow+"_"+variant] === sig) return "";
  return `

}

function programExercisesForDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const dow = d.getDay();
  const p = program[dow];
  if (!p || p.type === "rest") return [];
  if (p.type === "light") return (p.exercises||[]).map(e=>e.name);
  if (p.type === "main") {
    const wt = getWeekTypeForDate(dateStr);
    return (wt === "heavy" ? p.heavy : p.reps).map(e=>e.name);
  }
  return [];
}
function getWeekTypeForDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const wk = weekKeyFor(d);
  if (wk === window.__weekKey) return window.__weekType;
  return defaultWeekTypeFor(d);
}

function importData(fileInput){
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.exercises || !data.logs) { showToast("ファイルの形式が違うかも"); return; }
      if (!confirm("今のデータを上書きして読み込む?")) return;
      exercises = data.exercises;
      logs = data.logs;
      program = data.program || DEFAULT_PROGRAM;
      save("ironlog_exercises", exercises);
      save("ironlog_logs", logs);
      save("ironlog_program", program);
      if (data.weekType) { save("ironlog_weektype", data.weekType); window.__weekType = data.weekType.type; window.__weekKey = data.weekType.weekKey; }
      selectedExId = exercises[0] ? exercises[0].id : null;
      showToast("データを読み込んだ");
      render();
    } catch(err) {
      showToast("読み込みエラー");
    }
  };
  reader.readAsText(file);
  fileInput.value = "";
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  d.setHours(0,0,0,0);
  const startGuard = new Date(d);
  for (let i=0; i<3650; i++) {
    const dow = d.getDay();
    const dateStr = localDateStr(d);
    const p = program[dow];
    const isToday = dateStr === todayStr();
    if (p && p.type !== "rest") {
      const hasLog = logs.some(l => l.date === dateStr);
      if (hasLog) {
        streak++;
      } else if (!isToday) {
        break;
      }
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function checkMilestoneCelebration(streak){
  if (streak!==7 && streak!==30) { window.__celebrate = false; return; }
  const celebrated = load("ironlog_celebrated", []);
  if (celebrated.includes(streak)) { window.__celebrate = false; return; }
  window.__celebrate = streak;
  celebrated.push(streak);
  save("ironlog_celebrated", celebrated);
}

function buildHeatmapCells(periodDays){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = localDateStr(today);
  let rangeStart;
  if (periodDays) {
    rangeStart = new Date(today); rangeStart.setDate(rangeStart.getDate()-periodDays+1);
  } else {
    const allDates = logs.map(l=>l.date).sort();
    rangeStart = allDates.length ? new Date(allDates[0]+"T00:00:00") : new Date(today);
  }
  const gridStart = new Date(rangeStart);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const cells = [];
  let d = new Date(gridStart);
  let guard = 0;
  while (d <= today && guard < 400) {
    const dateStr = localDateStr(d);
    const dow = d.getDay();
    const p = program[dow];
    const beforeRange = d < rangeStart;
    let status = "pad";
    if (!beforeRange) {
      if (!p || p.type === "rest") status = "rest";
      else {
        const hasLog = logs.some(l=>l.date===dateStr);
        if (hasLog) status = "done";
        else if (dateStr === todayKey) status = "today";
        else status = "missed";
      }
    }
    cells.push({date: dateStr, status});
    d.setDate(d.getDate()+1);
    guard++;
  }
  return cells;
}
function selectHeatmapDay(dateStr){
  heatmapSelectedDate = (heatmapSelectedDate === dateStr) ? null : dateStr;
  render();

function renderHeatmapHTML(periodDays){
  const cells = buildHeatmapCells(periodDays);
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  let prevMonth = null;
  let labelsHtml = `<div style="display:flex; gap:3px;">`;
  let gridHtml = `<div style="display:flex; gap:3px;">`;
  weeks.forEach(week => {
    const firstReal = week.find(c => c.status !== "pad");
    let label = "";
    if (firstReal) {
      const monthNum = new Date(firstReal.date+"T00:00:00").getMonth()+1;
      if (monthNum !== prevMonth) { label = monthNum+"月"; prevMonth = monthNum; }
    }
    labelsHtml += `<div style="width:11px; font-size:9px; color:var(--text-muted); flex-shrink:0; white-space:nowrap; overflow:visible;">${label}</div>`;
    gridHtml += `<div style="display:flex; flex-direction:column; gap:3px; flex-shrink:0;">`;
    week.forEach(c => {
      if (c.status === "pad") { gridHtml += `<div style="width:11px; height:11px;"></div>`; return; }
      let bg = "transparent", border = "1px solid #33302B";
      if (c.status === "done") { bg = "#C1442A"; border = "1px solid #C1442A"; }
      else if (c.status === "rest") { bg = "#2A2724"; border = "1px solid #2A2724"; }
      else if (c.status === "missed") { bg = "transparent"; border = "1px solid #C1442A"; }
      else if (c.status === "today") { bg = "transparent"; border = "1px dashed #B9905A"; }
      const isSelected = heatmapSelectedDate === c.date;
      const sel = isSelected ? "outline:2px solid #F2ECE1; outline-offset:1px;" : "";
      gridHtml += `<div onclick="selectHeatmapDay('${c.date}')" style="width:11px; height:11px; border-radius:2px; background:${bg}; border:${border}; cursor:pointer; ${sel}"></div>`;
    });
    gridHtml += `</div>`;
  });
  labelsHtml += `</div>`;
  gridHtml += `</div>`;
  return `<div style="overflow-x:auto; padding-bottom:6px;"><div style="display:inline-block;">${labelsHtml}${gridHtml}</div></div>`;
}

          <button class="period-btn ${heatmapPeriod==='6m'?'period-active':''}" onclick="setHeatmapPeriod('6m')">半年</button>
          <button class="period-btn ${heatmapPeriod==='all'?'period-active':''}" onclick="setHeatmapPeriod('all')">全期間</button>
        </div>
      </div>
      ${renderHeatmapHTML(periodDays)}
      <div style="display:flex; gap:12px; font-size:10px; color:var(--text-muted); margin-top:6px; flex-wrap:wrap;">
        <span>🟧 トレした</span><span>⬜ 予定してたのに未記録</span><span>┄ 今日(まだ)</span><span>▪ 休養日</span>
      </div>
      ${renderHeatmapDetail()}
    </div>
  `;
}

function buildLineSVG(labels, seriesList, height){
  height = height || 180;
  const width=340, padL=32, padR=10, padT=Math.round(height*0.1), padB=Math.round(height*0.15);
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const allVals = seriesList.flatMap(s=>s.data).filter(v=>v!==null && v!==undefined);
  if (allVals.length===0) return '<p class="empty" style="padding:16px 0;">データなし</p>';
  let minV = Math.min(...allVals), maxV = Math.max(...allVals);
  if (minV===maxV) { minV -= 2; maxV += 2; } else { const pad=(maxV-minV)*0.2; minV-=pad; maxV+=pad; }
  const n = labels.length;
  const xPos = i => n<=1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const yPos = v => padT + (1-(v-minV)/(maxV-minV))*plotH;
  const fs = height < 140 ? 7 : 8;
  let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:${height}px; display:block;">`;
  for (let g=0; g<=2; g++){
    const gy = padT + (g/2)*plotH;
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="#42392F" stroke-width="1"/>`;
  }
  seriesList.forEach(s => {
    let segs = [], current = [];
    s.data.forEach((v,i) => {
      if (v===null || v===undefined) { if (current.length) { segs.push(current); current=[]; } }
      else current.push([xPos(i), yPos(v)]);
    });
    if (current.length) segs.push(current);
    segs.forEach(seg => {
      const d = seg.map((p,idx)=> (idx===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    });
    s.data.forEach((v,i) => {
      if (v===null || v===undefined) return;
      const cx=xPos(i), cy=yPos(v);
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.5" fill="${s.color}"/>`;
      svg += `<text x="${cx.toFixed(1)}" y="${(cy-5).toFixed(1)}" font-size="${fs}" fill="${s.color}" text-anchor="middle">${v}</text>`;
    });
  });
  const step = Math.max(1, Math.ceil(n/6));
  labels.forEach((lab,i) => {
    if (i % step !== 0 && i !== n-1) return;
    svg += `<text x="${xPos(i).toFixed(1)}" y="${height-6}" font-size="${fs}" fill="#A79C89" text-anchor="middle">${esc(lab)}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderExerciseChartCard(ex){
  const exLogs = logs.filter(l=>l.exerciseId===ex.id);
  if (exLogs.length === 0) {
    return `<div class="card" style="padding:12px 16px;"><p class="section-label" style="margin:0;">${esc(ex.name)}</p><p class="hint" style="margin:4px 0 0;">記録なし</p></div>`;
  }
  const dates = [...new Set(exLogs.map(l=>l.date))].sort();
  const labels = dates.map(d=>d.slice(5));
  const latestDate = dates[dates.length-1];
  const latest = exLogs.filter(l=>l.date===latestDate).reduce((best,l)=> isBetterSet(l,best) ? l : best, null);
  let seriesList, legendHtml;
  if (ex.unilateral) {
    const byKey = {};
    exLogs.forEach(l=>{
      const k = l.date+"_"+(l.side||"L");
      if (isBetterSet(l, byKey[k])) byKey[k] = l;
    });
    seriesList = [
      {data: dates.map(d=>byKey[d+"_L"]?byKey[d+"_L"].weight:null), color:"#C1442A"},
      {data: dates.map(d=>byKey[d+"_R"]?byKey[d+"_R"].weight:null), color:"#B9905A"},
    ];
    legendHtml = `<span>🔴左</span><span>🟡右</span>`;
  } else {
    const byDate = {};
    exLogs.forEach(l=>{
      if (isBetterSet(l, byDate[l.date])) byDate[l.date] = l;
    });
    seriesList = [
      {data: dates.map(d=>getWeekTypeForDate(d)==="heavy"?byDate[d].weight:null), color:"#C1442A"},
      {data: dates.map(d=>getWeekTypeForDate(d)==="reps"?byDate[d].weight:null), color:"#B9905A"},
    ];
    legendHtml = `<span>🔴重量週</span><span>🟡回数週</span>`;
  }
  const svg = buildLineSVG(labels, seriesList, 100);
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <p class="section-label" style="margin:0;">${esc(ex.name)}${latest.side?` <span style="color:var(--accent2);">(直近:${latest.side==="L"?"左":"右"})</span>`:""}</p>
        <p style="margin:0; font-family:ui-monospace,monospace; font-weight:800; color:var(--accent); font-size:15px;">${latest.weight}kg</p>
      </div>
      ${svg}
      <div style="display:flex; gap:10px; font-size:10px; color:var(--text-muted); margin-top:2px;">${legendHtml}</div>
    </div>
  `;
}

function renderChartTab(){
  const streak = computeStreak();
  checkMilestoneCelebration(streak);
  let html = renderStreakCard(streak);
  html += renderHeatmapCard();
  html += `<p class="section-label" style="margin-top:4px;">種目ごとの推移</p>`;
  html += exercises.map(renderExerciseChartCard).join("");
  return html;
}

function render(){
  const app = document.getElementById("app");
  if (tab === "log") app.innerHTML = renderLogTab();
  else if (tab === "week") app.innerHTML = renderWeekTab();
  else if (tab === "exercises") app.innerHTML = renderExercisesTab();
  else if (tab === "chart") app.innerHTML = renderChartTab();
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}
render();
</script>
